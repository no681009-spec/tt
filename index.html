<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>套房電錶拍照算費系統</title>
    <meta name="description" content="專為房東設計的出租套房電錶影像辨識與租金水電核算系統，支援自動判讀電錶度數、壓印抄表日期浮水印與匯出帳單明細。" />
    <meta property="og:title" content="套房電錶拍照算費系統" />
    <meta property="og:description" content="專為房東設計的出租套房電錶影像辨識與租金水電核算系統，支援自動判讀電錶度數、壓印抄表日期浮水印與匯出帳單明細。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 若發佈於 GitHub Pages 且未透過 GitHub Actions 編譯（直接讀取 main 分支根目錄），自動載入預編譯靜態檔，避免空白畫面
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './public/gh-pages/app.css';
            document.head.appendChild(css);

            var script = document.createElement('script');
            script.type = 'module';
            script.src = './public/gh-pages/app.js';
            document.body.appendChild(script);
          }
        }, 350);
      });
    </script>
  </body>
</html>
